const audio={ctx:null,enabled:true,master:null,engine:null,eg:null,tick:0,beat:0,
 init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=.22;this.master.connect(this.ctx.destination);this.engine=this.ctx.createOscillator();this.engine.type='sawtooth';this.eg=this.ctx.createGain();this.eg.gain.value=0;this.engine.connect(this.eg);this.eg.connect(this.master);this.engine.start()}catch{this.enabled=false}}if(this.ctx?.state==='suspended')this.ctx.resume().catch(()=>{})},
 tone(f=440,d=.1,type='square',vol=.15,slide=0){if(!this.ctx||!this.enabled||(paused&&!conversation))return;const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d)},
 noise(d=.3,vol=.3){if(!this.ctx||!this.enabled||paused)return;const n=this.ctx.sampleRate*d,b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),v=b.getChannelData(0);for(let i=0;i<n;i++)v[i]=(Math.random()*2-1)*(1-i/n);const s=this.ctx.createBufferSource(),g=this.ctx.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(this.master);s.start()},
 fanfare(){[392,494,587,784].forEach((v,i)=>setTimeout(()=>this.tone(v,.3,'triangle',.25),i*110))},
 update(dt){if(!this.ctx)return;this.master.gain.setTargetAtTime(this.enabled&&(!paused||conversation)?.22:0,this.ctx.currentTime,.04);let drive=driver&&!paused&&['drift','road'].includes(state);this.eg.gain.setTargetAtTime(drive?.1:0,this.ctx.currentTime,.08);this.engine.frequency.setTargetAtTime(drive?45+driver.speed*.35:40,this.ctx.currentTime,.1);if(paused||!this.enabled||['before-final','blackout'].includes(state))return;this.tick+=dt;if(this.tick>.24){this.tick=0;this.beat++;let seq=state==='final'?[392,494,587,784,659,587,494,587]:[110,0,165,0,130.81,0,146.83,0,110,220,165,0,130.81,196,146.83,0];let n=seq[this.beat%seq.length];if(n)this.tone(n,.16,'triangle',drive?.07:.18);if(this.beat%4===0)this.tone(65,.13,'sine',.3,25)}}};

function menu(){setScene('menu',`<div class="hero"><div><div class="eyebrow">● ZAPIS PRAWDZIWEJ LEGENDY / 2026</div><h1 class="title">KUBA <span>F19</span></h1><div class="subtitle">WAHACZ<br>PRZEZNACZENIA</div><p class="tagline">19 LAT. JEDEN MERCEDES. JEDNO DRZEWO.</p><p class="based">Based on unfortunately true events.</p><div class="hero-actions"><button class="primary" id="start">ROZPOCZNIJ LEGENDĘ <span>↗</span></button><button class="quiet" id="how">↳ JAK DO TEGO DOSZŁO?</button></div><div class="meta"><span>◷ TRYB FABULARNY</span><span>⌨ KLAWIATURA / DOTYK</span></div></div><div class="collage"><div class="photo-main">${photo('crash')}</div><div class="tape"></div><div class="photo-caption"><small>RUSIEC, ZIMA 2026</small><strong>STAN: TO SKOMPLIKOWANE.</strong></div><button class="portrait" id="portrait" aria-label="Zaczep Kubę">${photo('kuba')}</button><div class="stamp">100% PRAWDZIWE KOSZTY</div><div class="coordinate">52° N / RUSIEC MOTORSPORT</div></div></div><div class="episode-strip">${[['01','ZAKUP','Finansowy speedrun'],['02','DRIFT','Rusiec, nie Tokio'],['03','WARSZTAT','Dwa miesiące później'],['04','POWRÓT','30 km niepewności'],['05','SPRZEDAŻ','Kierunek: Mazury']].map(x=>`<div><b>${x[0]}</b><div><strong>${x[1]}</strong><small>${x[2]}</small></div></div>`).join('')}</div>${snow()}<div class="vhs"></div>`);bind('start',newGame);bind('how',how);bind('portrait',()=>{photoClicks++;toast(['Tak, to ja. Pewnie zastanawiacie się, skąd ten wahacz.','To zdjęcie z czasów, gdy miałem jeszcze pieniądze.','Nie klikaj mnie. Klikaj ogłoszenia z częściami.'][photoClicks%3]);if(photoClicks===5){achieve('PIĘĆ KLIKNIĘĆ. TYLE CO PASAŻERÓW.');openEgg('handshake')}})}

function how(){modal(`<div class="eyebrow">KRÓTKO O ZŁYCH DECYZJACH</div><h2>Najpierw auto.<br>Potem prawko.</h2><p>10 stycznia 2026 Kuba kupił Mercedesa. Tydzień później śnieg, pięciu pasażerów i jedno drzewo w Ruścu dopisały drugi rozdział.</p><p>Przeżyj legendę: driftuj, wskrześ wahacz, dojedź do Warszawy i negocjuj z kupcem z Olsztyna.</p><p><b>A / D lub ← / →</b> — skręt · <b>W / ↑</b> — gaz · <b>S / ↓</b> — hamulec · <b>Spacja</b> — ręczny · <b>E</b> — reakcja na awarię · <b>Esc / P</b> — pauza.</p><p>Auto przyspiesza też automatycznie. Na telefonie użyj przycisków pod drogą. W warsztacie przeciągnij część lub zaznacz ją i dotknij miejsca montażu.</p><p class="hint">Satyryczna gra o kosztach, nie instrukcja jazdy. Kwoty w grze są umowne. Rekord: ${Math.floor(best)} pkt.</p><button class="primary" id="close">WSZYSTKO JASNE</button>`);bind('close',closeModal)}

const speakerInfo={Kuba:{initial:'K',pitch:165,image:'kuba'},Dzwon:{initial:'D',pitch:130},Bruski:{initial:'B',pitch:105},Mechanik:{initial:'M',pitch:93},Kupiec:{initial:'O',pitch:115},Sprzedawca:{initial:'S',pitch:145},Narrator:{initial:'?',pitch:120}};
function talk({title='Rozmowa',lines,onEnd=()=>{},doneLabel='WRÓĆ DO GRY',blackout=false}){voice=null;conversation={title,lines,index:0,onEnd,doneLabel,blackout};paused=true;app.inert=true;keys={};$('#pause').disabled=true;renderTalk()}
function renderTalk(){const t=conversation,line=t.lines[t.index],who=speakerInfo[line.speaker]||speakerInfo.Narrator;voice=null;
  $('#modal-root').innerHTML=`<div class="modal-wrap dialogue-backdrop ${t.blackout?'blackout-modal':''}"><div class="modal dialogue-modal" role="dialog" aria-modal="true" aria-labelledby="conversation-title"><div class="conversation-head"><span class="eyebrow">${t.blackout?'PO UDERZENIU / RUSIEC':'ROZMOWA / KUBA F19'}</span><span class="conversation-progress">${t.index+1} / ${t.lines.length}</span></div><h2 id="conversation-title">${t.title}</h2><div class="speaker-card"><div class="speaker-icon">${who.image?photo(who.image):who.initial}</div><div><div class="speaker-name" id="speaker-name">${line.speaker}</div><div class="voice-indicator" id="voice-status"><i></i><i></i><i></i><span>MEMŁANIE</span></div>${line.aside?`<div class="speaker-aside">${line.aside}</div>`:''}</div></div><p class="spoken-line" id="spoken-line" aria-live="polite">${line.text}</p><div class="conversation-controls"><button class="quiet" id="dialogue-voice" aria-label="Powtórz memłanie rozmówcy">♫ POWTÓRZ MEMŁANIE</button><button class="primary" id="dialogue-next">${t.index===t.lines.length-1?t.doneLabel:'DALEJ →'}</button></div><p class="conversation-help">Czytaj we własnym tempie. Enter / spacja lub przycisk „Dalej”.</p>${t.index?`<details class="dialogue-log"><summary>Poprzednie wypowiedzi (${t.index})</summary>${t.lines.slice(0,t.index).map(l=>`<p><strong>${l.speaker}:</strong> ${l.text}</p>`).join('')}</details>`:''}</div></div>`;
  bind('dialogue-next',advanceTalk);bind('dialogue-voice',()=>mumble(line.speaker,line.text));$('#dialogue-next').focus();mumble(line.speaker,line.text)
}
function advanceTalk(){const t=conversation;if(!t)return;voice=null;if(t.index<t.lines.length-1){t.index++;renderTalk();return}const end=t.onEnd;conversation=null;closeModal();$('#pause').disabled=state==='menu';end()}
function mumble(speaker,text){if(!audio.enabled)return;audio.init();voice={speaker,pitch:(speakerInfo[speaker]||speakerInfo.Narrator).pitch,text,elapsed:0,next:0,index:0,duration:Math.min(3.2,Math.max(.65,text.length*.035))}}
function updateVoice(dt){const meter=$('#voice-status');if(meter)meter.classList.toggle('silent',!(voice&&audio.enabled));if(!voice||!audio.ctx||!audio.enabled||document.hidden)return;voice.elapsed+=dt;if(voice.elapsed>=voice.duration){voice=null;return}if(voice.elapsed<voice.next)return;voice.next=voice.elapsed+.09+(voice.index%3)*.023;const v=voice,ch=v.text.charCodeAt(v.index++%v.text.length),t=audio.ctx.currentTime,d=.07+(ch%4)*.016,o=audio.ctx.createOscillator(),filter=audio.ctx.createBiquadFilter(),gain=audio.ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(v.pitch*(.86+(ch%9)*.045),t);o.frequency.linearRampToValueAtTime(v.pitch*(.8+(ch%5)*.07),t+d);filter.type='bandpass';filter.frequency.value=550+(ch%5)*220;filter.Q.value=3;gain.gain.setValueAtTime(.001,t);gain.gain.linearRampToValueAtTime(.5,t+.012);gain.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(filter);filter.connect(gain);gain.connect(audio.master);o.start(t);o.stop(t+d)}

function garage(){setScene('garage',`<div class="scene">${heading('III','RUSIEC <span class="gold">MECHANIC SIMULATOR.</span>','DWA MIESIĄCE POD CHMURKĄ')}<div class="garage"><div><div class="garage-photos">${photo('wide')}${photo('front')}</div><div class="photo-label">DOKUMENTACJA NAPRAW / WARSZTAT Z WENTYLACJĄ 360°</div><p class="dialogue" style="font-size:23px">„To się zrobi w jeden weekend.”</p><p class="hint">— Kuba, osiem weekendów wcześniej</p><div id="repair-stats"></div><button class="quiet story-link" id="mechanic-call">☎ PRZYPOMNIJ RADĘ MECHANIKA</button></div><div><div class="eyebrow" id="repair-stage">01 / DOBIERZ CZĘŚĆ</div><div id="repair-work"><div class="choices"><button id="part-new"><span class="choice-code">A</span>Nowy wahacz · 800 zł</button><button id="part-used"><span class="choice-code">B</span>Używany wahacz z OLX · 400 zł</button><button id="part-tape"><span class="choice-code">C</span>Taśma izolacyjna i wiara w sukces</button><button id="part-prayer"><span class="choice-code">D</span>Modlitwa do niemieckiej inżynierii</button></div><p class="hint">Wybierz część. Mechanik skomentuje każdą opcję.</p><button class="quiet story-link" id="olx-profile">↗ SPRAWDŹ PROFIL SPRZEDAWCY Z OLX</button></div></div></div></div>`);repair={wallet:1800,health:8,bolts:[0,0,0],installed:false,selected:false,phase:0,wrong:0,fault:false};repairStats();bind('mechanic-call',mechanicAdvice);bind('olx-profile',()=>openEgg('olx'));bind('part-new',()=>partReply('new'));bind('part-used',()=>partReply('used'));bind('part-tape',()=>partReply('tape'));bind('part-prayer',()=>partReply('prayer'))}

function choosePart(cost){repair.wallet-=cost;repair.health=15;repairStats();$('#repair-stage').textContent='02 / DOPASUJ WAHACZ';$('#repair-work').innerHTML=`<p class="hint">Przeciągnij wahacz w złotą ramkę. Możesz też kliknąć część, potem ramkę.</p><div class="bench" id="bench"><svg viewBox="0 0 500 330"><path d="M90 25H395V90H330V230H170V90H90Z" fill="#16242d" stroke="#405563" stroke-width="16"/><path d="M100 140H400M250 45V270" stroke="#51636e" stroke-width="12"/><rect x="350" y="90" width="70" height="170" rx="18" fill="#111b22" stroke="#455563" stroke-width="7"/><path d="M340 100l-20 18 20 18-20 18 20 18-20 18 20 18" fill="none" stroke="#99aab1" stroke-width="7"/></svg><button id="target" class="target" aria-label="Zamontuj wahacz w ramce">MIEJSCE NA WAHACZ</button><button id="part" class="part" aria-label="Wybierz lub przeciągnij wahacz">${partSVG}</button></div><p class="repair-note" id="repair-note">Część zamienna: jedyny trójkąt, którego Kuba dziś potrzebuje.</p><div id="bolt-controls"></div>`;let p=$('#part'),t=$('#target');p.onpointerdown=e=>{repair.selected=true;p.classList.add('selected');p.setPointerCapture(e.pointerId);repair.drag={x:e.clientX,y:e.clientY}};p.onpointermove=e=>{if(!repair.drag)return;let r=$('#bench').getBoundingClientRect();p.style.left=(e.clientX-r.left-65)+'px';p.style.top=(e.clientY-r.top-30)+'px'};p.onpointerup=e=>{if(repair.installed)return;let r=t.getBoundingClientRect();repair.drag=null;if(e.clientX>r.left-15&&e.clientX<r.right+15&&e.clientY>r.top-15&&e.clientY<r.bottom+15)installPart()};p.onpointercancel=()=>repair.drag=null;bind('target',()=>{if(repair.selected)installPart();else $('#repair-note').textContent='Najpierw wybierz wahacz. Sama ramka nie naprawi auta.'})}
function installPart(){if(repair.installed)return;repair.installed=true;repair.health=35;repairStats();$('#part').remove();$('#target').innerHTML=partSVG;$('#target').style.border='none';$('#target').disabled=true;$('#repair-stage').textContent='03 / DOKRĘĆ TRZY ŚRUBY';$('#repair-note').textContent='Wahacz zamontowany. Dokręć każdą z trzech śrub po 3 razy w zielonej strefie.';$('#bolt-controls').innerHTML='<div class="timing" aria-label="Wskaźnik momentu dokręcania"><i id="needle"></i></div><p class="hint">Zielona strefa = właściwy moment. Poza nią klucz się ześlizgnie.</p>';[[46,51],[58,31],[71,51]].forEach(([x,y],i)=>{$('#bench').insertAdjacentHTML('beforeend',`<button class="bolt" id="bolt${i}" style="left:${x}%;top:${y}%" aria-label="Dokręć śrubę ${i+1}">0/3</button>`);bind('bolt'+i,()=>tighten(i))});achieve('MECHANIK SAMOUK');talk({title:'Część na swoim miejscu',lines:[{speaker:'Kuba',text:'Siedzi. Czyli mogę już jechać?'},{speaker:'Mechanik',text:'Jeszcze śruby. Trzy sztuki, każda porządnie dokręcona. Zielone pole na wskaźniku, pamiętasz?'}]})}
function tighten(i){if(paused||repair.bolts[i]>=3)return;if(repair.fault){$('#repair-note').textContent='Najpierw użyj odrdzewiacza. Nakrętka nadal jest zapieczona.';return;}let pos=(Math.sin(repair.phase*2.8)+1)*50;if(pos<32||pos>68){audio.noise(.08,.15);$('#repair-note').textContent='Klucz się ześlizgnął. Sąsiad nauczył się nowego słowa.';return}repair.bolts[i]++;audio.tone(180,.06,'square',.3);audio.noise(.05,.2);score+=100;let b=$('#bolt'+i);b.textContent=repair.bolts[i]+'/3';if(repair.bolts[i]===3){b.classList.add('done');b.disabled=true}let total=repair.bolts.reduce((a,b)=>a+b,0);repair.health=35+total*7;repair.wallet-=35;repairStats();$('#repair-note').textContent='DOBRZE · Śruba '+(i+1)+': '+repair.bolts[i]+'/3. Łącznie '+total+'/9 dokręceń.';if(total===4&&!repair.faultDone){repair.fault=true;repair.faultDone=true;talk({title:'Ta jedna nakrętka',lines:[{speaker:'Kuba',text:'Ta następna ani drgnie. Mocniej?'},{speaker:'Mechanik',text:'Nie urwij jej. Odrdzewiacz, trzy porządne psiknięcia. Dopiero potem klucz.'}],doneLabel:'BIORĘ ODRDZEWIACZ'});$('#repair-note').textContent='NIESPODZIANKA: zapieczona nakrętka. Uwolnij ją trzema użyciami odrdzewiacza.';$('#bolt-controls').insertAdjacentHTML('beforeend','<button id="rust" class="primary">ODRDZEWIACZ · 0 / 3</button>');let taps=0;bind('rust',()=>{taps++;audio.noise(.2,.1);$('#rust').textContent='ODRDZEWIACZ · '+taps+' / 3';if(taps===3){repair.fault=false;repair.wallet-=120;repairStats();$('#rust').remove();$('#repair-note').textContent='Nakrętka puściła. Portfel też. Dokończ dokręcanie.'}})}if(total===9){repair.health=100;repairStats();achieve('WAHACZ RESURRECTION');$('#repair-stage').textContent='NAPRAWIONE (PRAWDOPODOBNIE)';$('#bolt-controls').innerHTML='<button id="garage-done" class="primary">ZAMKNIJ MASKĘ →</button>';bind('garage-done',()=>cutscene({label:'PO DWÓCH MIESIĄCACH…',title:'MERCEDES ODZYSKAŁ<br>ZDOLNOŚĆ PORUSZANIA SIĘ.',body:'Tego samego dnia Kuba zdał egzamin na prawo jazdy. Kolejność odblokowywania osiągnięć była niestandardowa.',button:'ODBIERZ PRAWO JAZDY →',delay:0,next:()=>talk({title:'Po dwóch miesiącach',lines:[{speaker:'Kuba',text:'Stoi na kołach. W końcu.'},{speaker:'Dzwon',text:'I co teraz? Kolejny tydzień pod blokiem?'},{speaker:'Kuba',text:'Nie. Dzisiaj zdałem prawko. Wracam nim do Warszawy.'},{speaker:'Dzwon',text:'Dobra, to jak dojedziesz, napisz. Całe trzydzieści kilometrów chcę mieć udokumentowane.'}],doneLabel:'ODBLOKUJ PRAWO JAZDY',onEnd:license})}))}}
function license(){achieve('PRAWO JAZDY ODBLOKOWANE');cutscene({label:'NOWA UMIEJĘTNOŚĆ / +1 UPRAWNIENIE',title:'PRAWO JAZDY<br><span class="gold">ODBLOKOWANE!</span>',body:'Dzisiaj egzamin. Dzisiaj powrót. 30 kilometrów z Ruśca do Warszawy. Omijaj dziury i pobocze; przy awarii naciśnij E. Wahacz ma tylko jedno życie na przejazd.',img:'selfie',button:'KIERUNEK: WARSZAWA →',delay:0,next:()=>startDrive('road')});$('#continue').insertAdjacentHTML('beforebegin','<button class="quiet story-link" id="diploma-egg">▣ INNY WAŻNY DOKUMENT KUBY</button>');bind('diploma-egg',()=>openEgg('diploma'))}
const rounds=[{q:'Panie, a co się tutaj stało z tym błotnikiem?',a:['Fabryczny pakiet aerodynamiczny.','Limitowana edycja po kontakcie z naturą.','Nie pytaj pan o historię tego samochodu.','Niemiecka myśl techniczna.'],r:['Aerodynamika? To ja czuję przeciąg w cenie.','A, wersja dendrologiczna. Miałem Golfa w podobnej.','Historia sama wychodzi przez błotnik.','Myśl niemiecka, wykonanie: Rusiec.'],v:[-450,-150,-650,-350]}, {q:'A ten wahacz był robiony?',a:['Przeszedł duchową i mechaniczną przemianę.','Mam zdjęcia. Dużo zdjęć.','Nowy rozdział, nowy wahacz.','Nie ma już kontaktu z poprzednim właścicielem. Wahacz.'],r:['Czyli odrodzony. Ale ja płacę za używany.','To nie książka serwisowa. To dokument wojenny.','Dobrze, że chociaż tytuł się zgadza.','Rozumiem. Części się rozstały.'],v:[-300,100,-100,-400]}, {q:'Z Olsztyna jechałem. Za paliwo chociaż opuść.',a:['Mercedes też się już dużo najeździł. Emocjonalnie.','Dorzucę resztę odrdzewiacza.','To okazja. Tak mówiłem też przy zakupie.','Dobra. Byle miał na Mazurach lepiej.'],r:['Emocji na stacji nie przyjmują.','Taki pakiet serwisowy to ja rozumiem.','To obaj mamy dziś szansę się nauczyć.','U nas też drzewa, ale będę uważał.'],v:[-450,100,-300,-150]}];
function saleIntro(){talk({title:'Warszawa. Przez chwilę było normalnie.',lines:[{speaker:'Narrator',text:'Kuba wrócił do Warszawy i przez pewien czas po prostu jeździł Mercedesem. Bez fabularnego zwrotu przy każdym skrzyżowaniu.'},{speaker:'Kuba',text:'Dobra, sprzedaję.'},{speaker:'Dzwon',text:'Wyjdziesz na swoje?'},{speaker:'Kuba',text:'Wyjdę. Z samochodu.'},{speaker:'Narrator',text:'Na ogłoszenie odpowiedział kupiec z Olsztyna. Przyjechał obejrzeć auto, a historia przygotowała rachunek.'}],doneLabel:'POZNAJ KUPCA →',onEnd:startNegotiation})}
function startNegotiation(){neg={round:0,price:3900,waiting:false,selected:null,history:[]};renderNegotiation();talk({title:'Kupiec z Olsztyna',lines:[{speaker:'Kupiec',text:'Dzień dobry. Ja po Mercedesa. Z Olsztyna dzwoniłem.'},{speaker:'Kuba',text:'Tak, tak. To ten niebieski.'},{speaker:'Kupiec',text:'Widzę. Tylko na zdjęciach ten przód wyglądał jakoś… bardziej kompletnie.'},{speaker:'Kuba',text:'Chodź pan, wszystko opowiem.'}],doneLabel:'ZACZNIJ OGLĘDZINY'})}
function renderNegotiation(){const n=neg.round,r=rounds[n];setScene('negotiation',`<div class="scene">${heading('V','OLSZTYN <span class="gold">BUSINESS NEGOTIATIONS.</span>','SPRZEDAJ WSPOMNIENIA')}<div class="two-col"><div>${photo('wide','scene-photo')}<div class="photo-label">MERCEDES / HISTORIA JEST W CENIE</div><div id="neg-stats">${negotiationStats()}</div><button class="quiet story-link" id="neg-egg">🤝 ZAPLECZE NEGOCJACYJNE KUBY</button></div><div id="neg-dialogue"><div class="eyebrow">KUPIEC Z OLSZTYNA · PYTANIE ${n+1}/3</div><p class="dialogue">„${r.q}”</p><p class="hint">Wybierz odpowiedź Kuby. Potem usłyszysz reakcję kupca.</p><div class="choices" id="neg-choices">${r.a.map((a,i)=>`<button id="answer${i}"><span class="choice-code">${String.fromCharCode(65+i)}</span>${a}</button>`).join('')}</div></div></div></div>`);r.a.forEach((_,i)=>bind('answer'+i,()=>answer(i)));bind('neg-egg',()=>openEgg('handshake'))}
function negotiationStats(){return stats([['Umowna cena zakupu','8 000 zł',100],['Aktualna oferta',neg.price+' zł',neg.price/80],['Zysk z inwestycji','GŁĘBOKO NA MINUSIE',0]])}
const kubaComeback=['Czyli ten błotnik oglądamy już z rabatem?','Przynajmniej tej części jestem teraz pewny. Osobiście się znamy.','Dobra. Niech już ma na tych Mazurach spokojniejsze życie.'];
const buyerLast=['Oglądamy wszystko. Ja taki dokładny jestem.','To dobrze. Ja lubię, jak właściciel zna samochód. Szkoda, że aż tak.','Dogadamy się. Tylko jeszcze policzmy, na czym stoimy.'];
function answer(i){if(neg.waiting)return;neg.waiting=true;neg.selected=i;const r=rounds[neg.round],old=neg.price;neg.price+=r.v[i];const lines=[{speaker:'Kuba',text:r.a[i]},{speaker:'Kupiec',text:r.r[i]},{speaker:'Kuba',text:kubaComeback[neg.round]},{speaker:'Kupiec',text:buyerLast[neg.round]}];neg.history.push(...lines);$('#neg-choices').innerHTML=`<div class="chosen-answer"><small>KUBA / TWOJA ODPOWIEDŹ</small><p>${r.a[i]}</p></div>`;$('#neg-stats').innerHTML=negotiationStats();talk({title:'Oględziny — odpowiedź '+(neg.round+1),lines,doneLabel:'ZOBACZ OFERTĘ →',onEnd:()=>showOffer(r,old)})}
function showOffer(r,old){$('#neg-dialogue').innerHTML=`<div class="eyebrow">REAKCJA KUPCA / PYTANIE ${neg.round+1}/3</div><div class="chosen-answer"><small>KUBA</small><p>${r.a[neg.selected]}</p></div><div class="buyer-feedback"><small>KUPIEC Z OLSZTYNA</small><p>„${r.r[neg.selected]}”</p></div><div class="offer-change"><span>Oferta po tej rozmowie<br><small>${neg.price-old>0?'+':''}${neg.price-old} zł względem poprzedniej</small></span><b>${neg.price} zł</b></div><div class="negotiation-actions"><button class="primary" id="next-round">${neg.round<2?'KOLEJNE PYTANIE →':'USTAL SPRZEDAŻ →'}</button><button class="quiet" id="repeat-response">PRZECZYTAJ ROZMOWĘ JESZCZE RAZ</button></div>`;bind('repeat-response',()=>talk({title:'Ostatnia wymiana zdań',lines:neg.history.slice(-4),doneLabel:'WRÓĆ DO OFERTY'}));bind('next-round',()=>{neg.round++;neg.waiting=false;neg.selected=null;if(neg.round<3){renderNegotiation();mumble('Kupiec',rounds[neg.round].q)}else completeSale()});$('#next-round').focus()}
function completeSale(){talk({title:'Ostatni uścisk dłoni',lines:[{speaker:'Kupiec',text:'To co, '+neg.price+' zł i zabieram go do siebie?'},{speaker:'Kuba',text:'Dobra. Kluczyki są. Odrdzewiacz też dorzucę.'},{speaker:'Kupiec',text:'To jeszcze odpalmy.'},{speaker:'Narrator',text:'Mercedes odpalił. Kuba sprzedał go ze znaczną stratą. Niektóre rzeczy było słychać nawet przez silnik — na przykład ulgę.'}],doneLabel:'POŻEGNAJ MERCEDESA →',onEnd:()=>{score+=Math.floor(neg.price/4);achieve('BIZNESMEN ROKU — EDYCJA STRATY KAPITAŁOWEJ');mapScene()}})}

function mapScene(){setScene('map',`<div class="cut"><div class="eyebrow">EPILOG / OSTATNI SYGNAŁ</div><h2>KIERUNEK: <span class="blue">MAZURY.</span></h2><svg class="map" viewBox="0 0 650 350" role="img" aria-label="Schemat Polski z trasą Warszawa — Olsztyn — Pisz. Lokalizacja w Piszu niepotwierdzona."><path d="M180 50L280 25L340 48L425 43L480 90L465 160L510 220L450 282L390 270L350 317L280 280L205 285L158 242L115 215L140 160L115 104Z" fill="#1d303b" stroke="#49606e" stroke-width="2"/><g stroke="#ffffff08"><path d="M150 100H480M140 160H470M120 220H490M220 40V280M300 30V290M380 40V290M450 70V260"/></g><path class="route" d="M355 210Q280 165 310 90T400 105" fill="none" stroke="#f5ca62" stroke-width="4"/><g fill="#f5ca62"><circle cx="355" cy="210" r="6"/><circle cx="310" cy="90" r="6"/></g><circle cx="400" cy="105" r="10" fill="none" stroke="#81c5ff" stroke-dasharray="3 3"/><g fill="#e6edef" font-family="Consolas,monospace" font-size="13"><text x="370" y="235">WARSZAWA</text><text x="240" y="71">OLSZTYN</text><text x="418" y="109">PISZ (?)</text></g></svg><p>Mercedes odjechał na Mazury. Nikt nie wie, gdzie jest teraz. Ale podobno nadal jeździ. Pisz pozostaje niepotwierdzoną legendą.</p><div class="record">SPRZEDANY: ${neg.price} zł · UMOWNA STRATA: ${8000-neg.price} zł + naprawy</div><button id="epilogue" class="primary" disabled>A KUBA? →</button></div>`);transition={at:6,enable:true};bind('epilogue',()=>cutscene({id:'before-final',label:'PO TYM WSZYSTKIM…',title:'KUBA NADAL ŻYJE.<br><span class="blue">MERCEDES PODOBNO TEŻ.</span>',body:'Nie każda inwestycja się zwraca. Niektóre zostają legendą.',button:'ODBLOKUJ POZIOM 19 →',delay:4,next:finalScene}));}
function finalScene(){achieve('LEVEL 19 UNLOCKED');best=Math.max(best,Math.floor(score));try{localStorage.setItem('kuba-f19-best',String(best))}catch{}setScene('final',`<div class="scene final">${confetti()}<div class="eyebrow">MISSION PASSED! / WSZYSTKIEGO NAJLEPSZEGO</div><div class="two-col"><div><h2 style="margin:20px 0">LEVEL <span class="gold">19</span><br>UNLOCKED.</h2><p class="dialogue">KUBA FIAŁKOWSKI,<br>STATUS LEGENDY: POTWIERDZONY.</p><p>Życzymy Ci zdrowia, hajsu, szczęścia i przede wszystkim samochodu, którego nie trzeba naprawiać przez dwa miesiące.</p><div class="final-stats">${[['WIEK','19'],['KUPIONE MERCEDESY','1'],['POKONANE DRZEWA','0'],['WYMIENIONE WAHACZE','1+'],['ZDOBYTE PRAWO JAZDY','1'],['ZYSK Z MERCEDESA','💀']].map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')}</div><div class="record">WYNIK ${Math.floor(score)} · REKORD ${best} · OSIĄGNIĘCIA ${achievements.size}</div><div class="choices"><button class="primary" id="certificate">↓ CERTYFIKAT LEGENDY · PNG</button><button id="again">JESZCZE RAZ ↗</button><button class="quiet" id="album">AKTA LEGENDY · ZDJĘCIA I OSIĄGNIĘCIA</button></div></div><div><button id="final-photo" style="padding:0;border:0;background:none;width:100%" aria-label="Urodzinowa reakcja Kuby">${photo('selfie','scene-photo final-image')}</button><div class="photo-label">19 LAT / NAJLEPSZE HISTORIE JESZCZE PRZED TOBĄ.</div></div></div></div>`);audio.fanfare();bind('again',newGame);bind('certificate',certificate);bind('album',album);bind('final-photo',()=>toast(joke(),'KUBA MA OSTATNIE SŁOWO'))}
function album(){modal(`<div class="eyebrow">ARCHIWUM RUSIEC MOTORSPORT</div><h2>Dowody rzeczowe.</h2><div class="garage-photos">${['kuba','selfie','purchase','crash','wide','front'].map(k=>photo(k)).join('')}${[...easterFound].map(k=>'<div>'+eggVisual(k)+'<p>'+eggInfo[k].title+'</p></div>').join('')}</div><p>${[...achievements].join(' · ')}</p><p class="hint">Easter eggi: ${easterFound.size}/3. Szukaj portretu w menu, profilu OLX w warsztacie i dokumentu przy prawie jazdy.</p><button class="primary" id="close-album">WRÓĆ NA URODZINY</button>`);bind('close-album',closeModal)}
function certificate(){let c=document.createElement('canvas');c.width=1600;c.height=1100;let x=c.getContext('2d');x.fillStyle='#101820';x.fillRect(0,0,1600,1100);x.strokeStyle='#f5ca62';x.lineWidth=5;x.strokeRect(45,45,1510,1010);x.lineWidth=1;x.strokeRect(60,60,1480,980);x.textAlign='center';x.fillStyle='#f5ca62';x.font='bold 25px monospace';x.fillText('RUSIEC MOTORSPORT • EDYCJA URODZINOWA',800,135);x.font='900 88px Impact, Arial';x.fillText('CERTYFIKAT LEGENDY',800,285);x.fillStyle='#f4f1e8';x.font='bold 60px Arial';x.fillText('KUBA FIAŁKOWSKI',800,400);x.font='900 120px Impact, Arial';x.fillText('LEVEL 19 UNLOCKED',800,570);x.font='27px Arial';['Niniejszym potwierdzamy przetrwanie jednej inwestycji,','jednego drzewa i dwóch miesięcy mechaniki stosowanej.','Prawo jazdy zdobyte. Wahacz wskrzeszony. Status: legenda.'].forEach((s,i)=>x.fillText(s,800,680+i*48));x.fillStyle='#81c5ff';x.font='bold 28px monospace';x.fillText('WYNIK: '+Math.floor(score)+'  /  REKORD: '+best,800,905);x.fillStyle='#9aabb5';x.font='19px monospace';x.fillText('Podpisano: Komisja do spraw Niestandardowych Decyzji Finansowych',800,985);const url=c.toDataURL('image/png');modal(`<div class="eyebrow">POTWIERDZONE PRZEZ KOMISJĘ</div><h2>Certyfikat legendy.</h2><img src="${url}" alt="Certyfikat legendy Kuby Fiałkowskiego — Level 19 unlocked" style="width:100%;display:block"><p class="hint">PNG · 1600 × 1100 px. Jeśli przeglądarka otworzy obraz, wybierz „Zapisz obraz”.</p><a id="download-png" class="primary" style="display:inline-block;padding:14px 20px;text-decoration:none;font-weight:800" href="${url}" download="Kuba-F19-Certyfikat-Legendy.png">↓ POBIERZ PNG</a><button id="close-certificate">WRÓĆ NA URODZINY</button>`);bind('close-certificate',closeModal)}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)&&['drift','road'].includes(state))e.preventDefault();if(conversation&&(e.code==='Escape'||e.code==='KeyP'))return;if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat){if(paused)closeModal();else pause();return}if(conversation){if(['Enter','Space'].includes(e.code)&&!e.repeat){e.preventDefault();$('#dialogue-next')?.click()}return}if(paused)return;keys[e.code]=true;if(e.code==='KeyE')fixFault();if(e.code==='KeyF'&&state==='menu')openEgg('handshake')});document.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{keys={};if(state!=='menu'&&!paused)pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys={};if(state!=='menu'&&!paused)pause()}});
function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;if(!paused){clock+=dt;sceneClock+=dt;if(transition){if(sceneClock>=transition.at&&transition.enable){let b=$('#continue')||$('#epilogue');if(b)b.disabled=false;transition.enable=false}if(transition.auto&&sceneClock>=transition.auto){let fn=transition.next;transition=null;fn()}}if(driver)driveUpdate(dt);if(state==='garage'&&repair){repair.phase+=dt;let needle=$('#needle');if(needle)needle.style.left=((Math.sin(repair.phase*2.8)+1)*50)+'%'}if(toastUntil&&clock>toastUntil){$('#toast-root').innerHTML='';toastUntil=0;if(noticeQueue.length)showNotice()}}updateVoice(dt);audio.update(dt);requestAnimationFrame(frame)}
menu();requestAnimationFrame(frame);
