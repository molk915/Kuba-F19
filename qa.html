<!doctype html><html lang="pl"><meta charset="utf-8"><title>Local story QA — not shipped</title><style>body{margin:0;background:#12191d;color:white;font:12px Arial}nav{min-height:42px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:5px 10px}button{background:#ead08e;border:0;padding:7px}iframe{display:block;width:100%;height:calc(100vh - 52px);border:0}</style><nav>LOCAL QA <button onclick="scene('crash')">Po wypadku</button><button onclick="scene('garage')">Warsztat</button><button onclick="scene('road')">Trasa</button><button onclick="scene('negotiation')">Negocjacje</button><button onclick="scene('final')">Finał</button><button onclick="scene('menu')">Menu</button><button onclick="game.style.width='390px'">Telefon 390</button><button onclick="game.style.width='100%'">Desktop</button></nav><iframe id="game" src="/"></iframe><script>function scene(name){const w=game.contentWindow;w.advanceTalk&&w.closeModal();w.document.querySelector('#modal-root').innerHTML='';switch(name){case 'crash':w.crashScene();break;case 'garage':w.garageIntro();break;case 'road':w.startDrive('road');break;case 'negotiation':w.startNegotiation();break;case 'final':w.finalScene();break;default:w.menu()}if(!w.document.querySelector('#dialogue-next'))w.closeModal()}</script></html>
